name: CI Pipeline - DevSecOps Smart-Uni API

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # CI : BUILD, TEST, TRIVY & DOCKER HUB
  # ==========================================
  build-and-secure:
    name: Build & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (local)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: smart-uni-api:latest

      - name: Run Unit & Integration Tests
        run: |
          docker run --rm \
            -e SECRET_KEY="ci-test-key-safe-for-github-actions" \
            -e USE_SQLITE="True" \
            smart-uni-api:latest \
            coverage run manage.py test residence_connectee

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'smart-uni-api:latest'
          format: 'table'
          exit-code: 1
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

      - name: Login to DockerHub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image to Registry
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-uni-api:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/smart-uni-api:latest

  # ==========================================
  # TRIGGER CD (Déclenche smart-uni-infra)
  # ==========================================
  trigger-cd:
    name: Trigger Deployment in Infra Repo
    needs: build-and-secure
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch Event to smart-uni-infra
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          repository: Mohamine2/smart-uni-infra
          event-type: deploy-api
          client-payload: '{"sha": "${{ github.sha }}"}'